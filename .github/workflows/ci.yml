name: CI

# Pipeline shape:
#
#   static ─┐
#   test   ─┤
#   build  ─┤ (+ bundle secret scan)
#   e2e    ─┼─► CI OK ─► deploy (main only) → verify the live site
#   audit  ─┤
#   secrets─┤
#   codeql ─┤
#   deps   ─┘  (PRs)
#
# Every third-party action is pinned to a full commit SHA; the workflow token
# is read-only; nothing deploys unless every job passed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  SITE_URL: https://revellebeauty.fvarlee.workers.dev

jobs:
  static:
    name: Lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx eslint . --max-warnings=0
      - run: npm run typecheck

  test:
    name: Unit + component + Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build + bundle secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The bundle ships to every visitor — no secret may ever be inside it.
      - name: Scan the bundle for secrets
        run: |
          if grep -rEn "sk_(test|live)_|rk_(test|live)_|whsec_|service_role|SUPABASE_SERVICE|ORIGIN_SHARED_SECRET|-----BEGIN [A-Z ]*PRIVATE KEY" dist/; then
            echo "::error::Secret-looking string found in the built bundle"; exit 1
          fi
          echo "Bundle clean"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Real browser against the production build; the API is mocked at the
      # network boundary, so no backend or credentials are needed.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities in what ships (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Registry signatures and provenance of every installed package
        run: npm audit signatures

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --no-banner --redact --exit-code 1

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The single required status check for branch protection.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [static, test, build, e2e, audit, secrets, codeql, dependency-review]
    if: always()
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job did not pass ($r)"; exit 1 ;; esac
          done

  # ── Deploy: Cloudflare Workers on every green main build. ──────────────
  #   CLOUDFLARE_API_TOKEN   (Workers Scripts: Edit)
  #   CLOUDFLARE_ACCOUNT_ID
  deploy:
    name: Deploy (Cloudflare Workers) + verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci-ok]
    # Explicit gate check: GitHub's implicit success() also fails when a job
    # further up the chain was skipped (dependency-review is, on pushes).
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping deploy"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cf.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Build for production
        if: steps.cf.outputs.configured == 'true'
        run: |
          npm ci
          npm run build
        env:
          # Same-origin by default: the Worker proxies /api/* to the backend.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
      - name: Publish to Cloudflare (wrangler from the lockfile)
        if: steps.cf.outputs.configured == 'true'
        run: npx wrangler deploy

      # Post-deploy verification: the live site answers, carries its security
      # headers, and reaches the API through the Worker.
      - name: Verify the live site
        if: steps.cf.outputs.configured == 'true'
        run: |
          set -euo pipefail
          headers=""
          for _ in $(seq 1 10); do
            if headers="$(curl -sS -D - -o /dev/null "$SITE_URL/")"; then break; fi
            sleep 6
          done
          echo "$headers" | grep -qi '^content-security-policy:' || { echo "::error::live site is missing its CSP header"; exit 1; }
          echo "$headers" | grep -qi '^strict-transport-security:' || { echo "::error::live site is missing HSTS"; exit 1; }
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL/api/health")"
          [ "$code" = 200 ] || { echo "::error::API health through the Worker returned $code"; exit 1; }
          echo "Live site verified"
